<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="650" height="250">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6px; }
        .header { fill: #30363d; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .text { font-family: monospace; font-size: 14px; fill: #c9d1d9; }
        .label { font-family: monospace; font-size: 14px; fill: #8b949e; font-weight: bold; }
        .accent { font-family: monospace; font-size: 14px; fill: #4dabf7; }
        
        @keyframes typing {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .animated-row {
            opacity: 0;
            animation: typing 0.1s forwards;
        }
    </style>
    
    <!-- Window background -->
    <rect class="bg" x="1" y="1" width="648" height="248" />
    
    <!-- Window header -->
    <path class="header" d="M 1 6 Q 1 1 6 1 L 643 1 Q 648 1 648 6 L 648 30 L 1 30 Z" />
    
    <!-- Window controls -->
    <circle class="dot-red" cx="20" cy="15" r="6" />
    <circle class="dot-yellow" cx="40" cy="15" r="6" />
    <circle class="dot-green" cx="60" cy="15" r="6" />
    
    <!-- Title -->
    <text class="label" x="325.0" y="20" text-anchor="middle">subhamroy-Musicman@github: ~</text>

    <g class="animated-row" style="animation-delay: 400ms;">
        <text class="accent" x="30" y="70">$</text>
        <text class="label" x="50" y="70">role</text>
        <text class="text" x="120" y="70">AI Developer, Full stack developer</text>
    </g>

    <g class="animated-row" style="animation-delay: 800ms;">
        <text class="accent" x="30" y="105">$</text>
        <text class="label" x="50" y="105">stack</text>
        <text class="text" x="120" y="105">MongoDB, React, Node.js, HTML5, CSS3, Pytorch, MySQL</text>
    </g>

    <g class="animated-row" style="animation-delay: 1200ms;">
        <text class="accent" x="30" y="140">$</text>
        <rect class="text" x="50" y="128" width="8" height="15">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </rect>
    </g>
</svg>
